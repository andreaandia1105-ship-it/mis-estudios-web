    papers:[
      {title:"Glacier retreat in the tropical Andes (Rabatel et al., 2013)", journal:"The Cryosphere", url:"https://doi.org/10.5194/tc-7-81-2013"},
      {title:"Shrinking glaciers and water security in Peru (Bury et al., 2011)", journal:"Annals of the Association of American Geographers", url:"https://doi.org/10.1080/00045608.2010.523511"},
    ]
  },
];

let currentTab = 'all';
let currentSearch = '';

function setTab(cat, el) {
  currentTab = cat;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderCards();
}

function filterAll() {
  currentSearch = document.getElementById('search').value.toLowerCase();
  renderCards();
}

function impactDots(n) {
  let h = '<div class="impact-dots">';
  for(let i=1;i<=5;i++) h += `<div class="dot ${i<=n?'dot-fill':'dot-empty'}"></div>`;
  return h + '</div>';
}

function openLink(url) {
  window.open(url, '_blank');
}

function renderCards() {
  const container = document.getElementById('cards-container');
  let filtered = DATA.filter(d => {
    const matchCat = currentTab === 'all' || d.cat === currentTab;
    const matchSearch = !currentSearch ||
      d.title.toLowerCase().includes(currentSearch) ||
      d.body.toLowerCase().includes(currentSearch) ||
      d.sub.toLowerCase().includes(currentSearch);
    return matchCat && matchSearch;
  });

  document.getElementById('no-results').style.display = filtered.length ? 'none' : 'block';

  container.innerHTML = filtered.map(d => `
    <div class="var-card">
      <div class="var-header">
        <div class="var-icon" style="background:var(--color-background-secondary); font-size:20px;">${d.icon}</div>
        <div style="flex:1;">
          <p class="var-title">${d.title} <span class="badge ${d.badge}" style="margin-left:6px;">${d.badgeLabel}</span></p>
          <p class="var-sub">${d.sub}</p>
        </div>
      </div>

      <div class="impact-bar">
        <span class="impact-label" style="font-size:12px; color:var(--color-text-tertiary);">Impacto en Rímac</span>
        ${impactDots(d.impact)}
      </div>

      <p class="var-body" style="margin-top:.75rem;">${d.body}</p>

      <div class="section-label">Herramienta / fuente de datos</div>
      <div style="margin-bottom:.75rem;">
        <span class="tool-badge"><i class="ti ti-tool" aria-hidden="true" style="font-size:13px;"></i> ${d.tool}</span>
      </div>

      <div class="section-label">Páginas de consulta</div>
      <div class="link-row" style="margin-bottom:.75rem;">
        ${d.sources.map(s => `<span class="link-chip" onclick="openLink('${s.url}')"><i class="ti ti-external-link" aria-hidden="true"></i>${s.label}</span>`).join('')}
      </div>

      <div class="section-label">Artículos de referencia</div>
      <div class="paper-row">
        ${d.papers.map(p => `
          <div class="paper-item">
            <a onclick="openLink('${p.url}')" style="cursor:pointer;">${p.title}</a>
            <div class="paper-journal"><i class="ti ti-book" aria-hidden="true" style="font-size:12px;"></i> ${p.journal}</div>
          </div>`).join('')}
      </div>
    </div>
  `).join('');
}

renderCards();
</script>

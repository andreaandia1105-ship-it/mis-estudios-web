<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>📚 Mis Estudios — Repositorio UNALM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Source+Sans+3:wght@300;400;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Source Sans 3', sans-serif;
    background: #0a0f1a;
    color: #e2e8f0;
    min-height: 100vh;
}

/* ── HEADER ── */
header {
    background: linear-gradient(135deg, #0f1e3a 0%, #1a2332 100%);
    padding: 20px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    position: sticky;
    top: 0;
    z-index: 100;
}
.hinner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
}
header h1 {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(20px, 5vw, 24px);
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.4px;
    display: flex;
    align-items: center;
    gap: 8px;
}
header p { font-size: 11px; color: #64748b; margin-top: 2px; }
#total-badge {
    font-size: 11px;
    padding: 6px 14px;
    border-radius: 20px;
    background: rgba(59,130,246,0.15);
    color: #93c5fd;
    border: 1px solid rgba(59,130,246,0.2);
}

/* ── BUSCADOR ── */
.search-wrap {
    background: #0d1525;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    padding: 12px 16px;
    position: sticky;
    top: 72px;
    z-index: 99;
}
.search-wrap input {
    width: 100%;
    max-width: 1200px;
    display: block;
    margin: 0 auto;
    background: #1a2332;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 12px 18px;
    color: #e2e8f0;
    font-size: 15px;
    font-family: 'Source Sans 3', sans-serif;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.search-wrap input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
}
.search-wrap input::placeholder { color: #475569; }

/* ── MAIN ── */
main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 16px 80px;
}

/* ── SEPARADORES DE GRUPO ── */
.grupo-separador {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 32px 0 16px;
}
.grupo-separador:first-child { margin-top: 0; }
.grupo-label {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
    padding: 4px 12px;
    border-radius: 20px;
}
.grupo-linea {
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.07);
}

/* Colores por grupo */
.grupo-UNALM    .grupo-label { background: rgba(16,185,129,0.12); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.2); }
.grupo-IDIOMAS  .grupo-label { background: rgba(245,158,11,0.12);  color: #fcd34d; border: 1px solid rgba(245,158,11,0.2);  }
.grupo-PERSONAL .grupo-label { background: rgba(139,92,246,0.12);  color: #c4b5fd; border: 1px solid rgba(139,92,246,0.2);  }
.grupo-CIENCIAS .grupo-label { background: rgba(59,130,246,0.12);  color: #93c5fd; border: 1px solid rgba(59,130,246,0.2);  }
.grupo-GENERAL  .grupo-label { background: rgba(236,72,153,0.12);  color: #f9a8d4; border: 1px solid rgba(236,72,153,0.2);  }

/* Líneas por grupo */
.grupo-UNALM    .grupo-linea { background: rgba(16,185,129,0.15); }
.grupo-IDIOMAS  .grupo-linea { background: rgba(245,158,11,0.15); }
.grupo-PERSONAL .grupo-linea { background: rgba(139,92,246,0.15); }
.grupo-CIENCIAS .grupo-linea { background: rgba(59,130,246,0.15); }
.grupo-GENERAL  .grupo-linea { background: rgba(236,72,153,0.15); }

/* Borde izquierdo de la card según grupo */
.grupo-UNALM    .curso-card { border-left: 3px solid rgba(16,185,129,0.4); }
.grupo-IDIOMAS  .curso-card { border-left: 3px solid rgba(245,158,11,0.4); }
.grupo-PERSONAL .curso-card { border-left: 3px solid rgba(139,92,246,0.4); }
.grupo-CIENCIAS .curso-card { border-left: 3px solid rgba(59,130,246,0.4); }
.grupo-GENERAL  .curso-card { border-left: 3px solid rgba(236,72,153,0.4); }

/* ── GRID CURSOS ── */
.cursos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
}

.curso-card {
    background: #111827;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.08);
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
}
.curso-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 24px rgba(0,0,0,0.4);
}
.curso-header {
    background: rgba(0,0,0,0.35);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}
.curso-icon { font-size: 30px; flex-shrink: 0; }
.curso-title {
    font-family: 'Oswald', sans-serif;
    font-size: 17px;
    font-weight: 700;
    flex: 1;
    line-height: 1.2;
}
.curso-count {
    font-size: 11px;
    background: #1e293b;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
}

/* ── CATEGORÍAS ── */
.categorias {
    display: grid;
    gap: 1px;
    background: rgba(255,255,255,0.05);
}
.categoria-item {
    background: #0f172a;
    padding: 20px 10px;
    text-align: center;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    border: none;
    color: #e2e8f0;
    font-family: 'Source Sans 3', sans-serif;
}
.categoria-item:hover { background: #1e293b; transform: scale(0.97); }
.categoria-icono { font-size: 26px; display: block; margin-bottom: 6px; line-height: 1; }
.categoria-nombre { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; display: block; }
.categoria-cantidad { font-size: 11px; opacity: 0.55; margin-top: 3px; display: block; }

/* ── DETALLE ── */
.detail-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
}
.back-btn {
    background: #1e293b;
    border: none;
    padding: 8px 18px;
    border-radius: 30px;
    color: #e2e8f0;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.2s;
    font-family: 'Source Sans 3', sans-serif;
}
.back-btn:hover { background: #334155; }
.detail-title { font-family: 'Oswald', sans-serif; font-size: 22px; font-weight: 700; }
.detail-subtitle { font-size: 13px; color: #94a3b8; margin-top: 2px; }

/* ── GRID ARCHIVOS ── */
.grid-archivos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
}
.card-archivo {
    background: #111827;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 14px;
    padding: 18px;
    text-decoration: none;
    color: #e2e8f0;
    display: block;
    transition: transform 0.2s, background 0.2s, border-color 0.2s;
}
.card-archivo:hover { transform: translateY(-3px); background: #1a2332; border-color: #3b82f6; }
.card-num { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; color: #60a5fa; }
.card-archivo h3 { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
.card-archivo p { font-size: 12px; color: #64748b; line-height: 1.4; }

/* ── ESTADOS ── */
.empty-state {
    background: #0d1525;
    border: 1px dashed rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 40px;
    text-align: center;
    color: #64748b;
    font-size: 14px;
    line-height: 1.6;
}
.loading { text-align: center; padding: 60px 20px; }
.loading-spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(59,130,246,0.2);
    border-top-color: #3b82f6;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── FAB ── */
.fab-add {
    position: fixed;
    bottom: 24px; right: 24px;
    width: 52px; height: 52px;
    border-radius: 50%;
    background: #3b82f6;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(59,130,246,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, background 0.2s;
    opacity: 0.7;
}
.fab-add:hover { transform: scale(1.08); background: #2563eb; opacity: 1; }

@media (max-width: 600px) {
    .cursos-grid { grid-template-columns: 1fr; }
    .fab-add { bottom: 16px; right: 16px; width: 46px; height: 46px; font-size: 20px; }
}
</style>
</head>
<body>

<header>
    <div class="hinner">
        <div>
            <h1><span>📚</span> Mis Estudios</h1>
            <p>Repositorio de resúmenes UNALM</p>
        </div>
        <span id="total-badge">📊 Cargando...</span>
    </div>
</header>

<div class="search-wrap">
    <input type="text" id="searchInput" placeholder="🔍 Buscar por tema, concepto, curso..." oninput="filterArchivos()">
</div>

<main id="main">
    <div class="loading">
        <div class="loading-spinner"></div>
        <p style="color:#64748b;">Cargando materiales de estudio...</p>
    </div>
</main>

<button class="fab-add" onclick="scrollToTop()" title="Volver arriba">↑</button>

<script>
// ── Estado global ──────────────────────────────────────────────
let allCoursesData  = [];
let currentView     = 'cursos';
let currentCategory = null;

const CATEGORIAS_FIJAS = ['GENERAL'];

const ICONOS = {
    TEORIA: '📘', PC: '✍️', EXAMENES: '📝', LECTURAS: '📖',
    ITALIANO: '🇮🇹', INGLES: '🇬🇧', FONETICA: '🗣️', GRAMATICA: '📖', INMERSION: '🎧', PRACTICA: '✍️',
    METEOROLOGIA: '🌤️', OCEANOGRAFIA: '🌊', FISICA: '🔭', DERECHO: '⚖️', POLITICA: '🏛️', LEYES: '📜',
    NORMATIVAS: '📋', AMBIENTE: '♻️', 'CIENCIAS DE LA ATMOSFERA': '🌍',
    CLIMATOLOGIA: '🌡️', HIDROMETEOROLOGIA: '🌧️', MICROMETEOROLOGIA: '🔬', MODELAMIENTO: '💻',
    'SENSORES REMOTOS': '📡',
    TECNOLOGIA: '🤖', PYTHON: '🐍', DATOS: '📊', GEO: '🗺️', IA: '🧠', VIZ: '📈',
    SALUD: '💪', NUTRICION: '🍎', BIOMECANICA: '🦴', POTENCIA: '⚡', REPARACION: '🧘',
    'CULTURA GENERAL': '📚', LIBROS: '📖', ARTES: '🎨', MUSICA: '🎵', CINE: '🎬',
    HISTORIA: '⏳', IDEAS: '💡', SOCIEDAD: '👥', MUNDO: '🌐',
    INVESTIGACION: '🔬', OTROS: '📂'
};

// Etiquetas de grupo
const GRUPOS_LABEL = {
    UNALM:    '🎓 UNALM',
    IDIOMAS:  '🌐 Idiomas',
    PERSONAL: '💡 Personal',
    CIENCIAS: '🔭 Ciencias',
    GENERAL:  '🧩 General'
};

function getCategoriaKey(numero) {
    if (!numero) return 'OTROS';
    const raw = numero.trim().toUpperCase();
    for (let key in ICONOS) {
        if (raw.startsWith(key)) return key;
    }
    if (raw.startsWith('EXAMEN'))  return 'EXAMENES';
    if (raw.startsWith('PC'))      return 'PC';
    if (raw.startsWith('TEORIA'))  return 'TEORIA';
    return raw.split(' ')[0];
}

// ── Carga JSON ─────────────────────────────────────────────────
fetch('lecturas.json')
    .then(r => {
        if (!r.ok) throw new Error('No se pudo cargar lecturas.json');
        return r.json();
    })
    .then(data => {
        allCoursesData = data;
        renderCursosView(data);
        updateTotalBadge(data);
    })
    .catch(err => {
        document.getElementById('main').innerHTML =
            `<div class="empty-state">⚠️ Error: ${err.message}<br>Asegúrate de que lecturas.json existe junto a index.html.</div>`;
    });

// ── Vista principal ────────────────────────────────────────────
function renderCursosView(data) {
    const main = document.getElementById('main');
    main.innerHTML = '';
    currentView = 'cursos';

    // Agrupar cursos por campo "grupo"
    const grupos = {};
    const grupoOrden = [];

    data.forEach(curso => {
        const g = curso.grupo || 'OTROS';
        if (!grupos[g]) {
            grupos[g] = [];
            grupoOrden.push(g);
        }
        grupos[g].push(curso);
    });

    grupoOrden.forEach(grupoKey => {
        // Separador de grupo
        const sep = document.createElement('div');
        sep.className = `grupo-separador grupo-${grupoKey}`;
        sep.innerHTML = `
            <div class="grupo-linea"></div>
            <span class="grupo-label">${GRUPOS_LABEL[grupoKey] || grupoKey}</span>
            <div class="grupo-linea"></div>`;
        main.appendChild(sep);

        // Grid de cursos del grupo
        const grid = document.createElement('div');
        grid.className = `cursos-grid grupo-${grupoKey}`;

        grupos[grupoKey].forEach(curso => {
            let listaCategorias = curso.categorias || CATEGORIAS_FIJAS;
            if (!Array.isArray(listaCategorias) || listaCategorias.length === 0) {
                listaCategorias = CATEGORIAS_FIJAS;
            }

            const gruposMap = {};
            listaCategorias.forEach(cat => gruposMap[cat] = []);

            curso.lecturas.forEach(lectura => {
                const clave = getCategoriaKey(lectura.numero);
                if (gruposMap[clave] !== undefined) {
                    gruposMap[clave].push(lectura);
                } else {
                    gruposMap[listaCategorias[listaCategorias.length - 1]].push(lectura);
                }
            });

            const numCats  = listaCategorias.length;
            const gridCols = numCats <= 4 ? `repeat(${numCats}, 1fr)` : 'repeat(3, 1fr)';

            const cuadrosHTML = listaCategorias.map(cat => `
                <div class="categoria-item" data-curso="${curso.curso}" data-tipo="${cat}">
                    <span class="categoria-icono">${ICONOS[cat] || '📁'}</span>
                    <span class="categoria-nombre">${cat}</span>
                    <span class="categoria-cantidad">${gruposMap[cat].length} archivos</span>
                </div>`
            ).join('');

            const card = document.createElement('div');
            card.className = 'curso-card';
            card.innerHTML = `
                <div class="curso-header">
                    <span class="curso-icon">${curso.icono}</span>
                    <span class="curso-title">${curso.curso}</span>
                    <span class="curso-count">${curso.lecturas.length} archivos</span>
                </div>
                <div class="categorias" style="grid-template-columns:${gridCols};">
                    ${cuadrosHTML}
                </div>`;

            card.querySelectorAll('.categoria-item').forEach(item => {
                item.addEventListener('click', e => {
                    e.stopPropagation();
                    showDetailView(item.dataset.curso, item.dataset.tipo);
                });
            });

            grid.appendChild(card);
        });

        main.appendChild(grid);
    });

    document.getElementById('searchInput').value = '';
}

// ── Vista detalle ──────────────────────────────────────────────
function showDetailView(cursoNombre, tipo) {
    currentCategory = { cursoNombre, tipo };
    document.getElementById('searchInput').value = '';

    const curso = allCoursesData.find(c => c.curso === cursoNombre);
    if (!curso) return;

    const archivos = curso.lecturas.filter(l =>
        getCategoriaKey(l.numero) === tipo.toUpperCase()
    );

    renderDetailView(cursoNombre, tipo, archivos);
}

function renderDetailView(cursoNombre, tipo, archivos, filteredArchivos = null) {
    const main  = document.getElementById('main');
    currentView = 'detalle';
    const items = filteredArchivos !== null ? filteredArchivos : archivos;

    let html = `
        <div>
            <div class="detail-header">
                <button class="back-btn" id="backBtn">← Volver a cursos</button>
                <div>
                    <div class="detail-title">${cursoNombre}</div>
                    <div class="detail-subtitle">${tipo} · ${items.length} archivos</div>
                </div>
            </div>
            <div class="grid-archivos">`;

    if (items.length === 0) {
        html += `<div class="empty-state">📭 No hay archivos en esta categoría aún.</div>`;
    } else {
        items.forEach(arch => {
            html += `
                <a class="card-archivo" href="${arch.archivo}">
                    <div class="card-num">${arch.numero}</div>
                    <h3>${arch.titulo}</h3>
                    <p>${arch.descripcion || 'Sin descripción'}</p>
                </a>`;
        });
    }

    html += `</div></div>`;
    main.innerHTML = html;

    document.getElementById('backBtn').addEventListener('click', () => {
        renderCursosView(allCoursesData);
        updateTotalBadge(allCoursesData);
        currentView = 'cursos';
    });

    window.currentDetailArchivos = archivos;
    window.currentDetailCurso    = cursoNombre;
    window.currentDetailTipo     = tipo;
}

// ── Búsqueda ───────────────────────────────────────────────────
function filterArchivos() {
    if (currentView !== 'detalle' || !window.currentDetailArchivos) return;

    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    if (query.length === 1) return;

    const filtered = query.length >= 2
        ? window.currentDetailArchivos.filter(arch => {
            const txt = `${arch.numero} ${arch.titulo} ${arch.descripcion || ''} ${arch.keywords || ''}`.toLowerCase();
            return txt.includes(query);
          })
        : window.currentDetailArchivos;

    renderDetailView(window.currentDetailCurso, window.currentDetailTipo, window.currentDetailArchivos, filtered);
}

// ── Utilidades ─────────────────────────────────────────────────
function updateTotalBadge(data) {
    const total = data.reduce((acc, c) => acc + c.lecturas.length, 0);
    document.getElementById('total-badge').textContent = `📊 ${data.length} cursos · ${total} archivos`;
}

function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

window.addEventListener('scroll', () => {
    document.querySelector('.fab-add').style.opacity = window.scrollY > 300 ? '1' : '0.7';
});
</script>

</body>
</html>

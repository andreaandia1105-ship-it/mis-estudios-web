<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>📚 Mis Estudios — Repositorio UNALM</title>
    <style>
        /* [Tus estilos se mantienen igual, solo asegúrate de tener estos colores de grupo] */
        .grupo-separador { display: flex; align-items: center; gap: 14px; margin: 40px 0 20px; }
        .grupo-label { font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 700; text-transform: uppercase; padding: 5px 15px; border-radius: 20px; background: rgba(59,130,246,0.1); color: #93c5fd; }
        .grupo-linea { flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
        /* Colores específicos */
        .grupo-UNALM .grupo-label { color: #6ee7b7; background: rgba(16,185,129,0.1); }
        .grupo-IDIOMAS .grupo-label { color: #fcd34d; background: rgba(245,158,11,0.1); }
        
        /* [Aquí va el resto de tu CSS anterior] */
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Source+Sans+3:wght@300;400;600&display=swap');
        body { font-family: 'Source Sans 3', sans-serif; background: #0a0f1a; color: #e2e8f0; margin: 0; padding: 0; }
        main { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .cursos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .curso-card { background: #111827; border-radius: 20px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; }
        .curso-header { background: rgba(0,0,0,0.3); padding: 15px; display: flex; align-items: center; gap: 10px; }
        .categorias { display: grid; gap: 1px; background: rgba(255,255,255,0.05); }
        .categoria-item { background: #0f172a; padding: 15px; text-align: center; cursor: pointer; }
    </style>
</head>
<body>

<main id="main">
    <div class="loading">Cargando repositorio estratégico...</div>
</main>

<script>
let allCoursesData = [];
const CATEGORIAS_FIJAS = ['GENERAL'];
const GRUPOS_LABEL = { UNALM: '🎓 UNALM', IDIOMAS: '🌐 Idiomas', PERSONAL: '💡 Personal', CIENCIAS: '🔭 Ciencias', GENERAL: '🧩 General' };

fetch('lecturas.json')
    .then(r => r.json())
    .then(data => {
        allCoursesData = data;
        renderCursosView(data);
    });

function renderCursosView(data) {
    const main = document.getElementById('main');
    main.innerHTML = '';

    // 1. Agrupar cursos por su etiqueta de grupo (UNALM, Idiomas, etc.)
    const grupos = {};
    data.forEach(curso => {
        const g = curso.grupo || 'OTROS';
        if (!grupos[g]) grupos[g] = [];
        grupos[g].push(curso);
    });

    // 2. Dibujar cada grupo
    Object.keys(grupos).forEach(grupoKey => {
        const section = document.createElement('section');
        section.className = `grupo-container grupo-${grupoKey}`;
        
        section.innerHTML = `
            <div class="grupo-separador">
                <div class="grupo-linea"></div>
                <span class="grupo-label">${GRUPOS_LABEL[grupoKey] || grupoKey}</span>
                <div class="grupo-linea"></div>
            </div>
            <div class="cursos-grid"></div>
        `;

        const grid = section.querySelector('.cursos-grid');
        
        grupos[grupoKey].forEach(curso => {
            // Preparar las categorías y contar archivos
            let listaCategorias = (curso.categorias && curso.categorias.length > 0) ? curso.categorias : CATEGORIAS_FIJAS;
            
            // Contamos cuántos archivos hay por cada categoría para mostrar el número en el cuadrito
            const conteoPorCat = {};
            listaCategorias.forEach(cat => {
                conteoPorCat[cat] = curso.lecturas.filter(l => getCategoriaKey(l.numero) === cat.toUpperCase()).length;
            });

            const card = document.createElement('div');
            card.className = 'curso-card';
            card.innerHTML = `
                <div class="curso-header">
                    <span class="curso-icon">${curso.icono}</span>
                    <span class="curso-title">${curso.curso}</span>
                    <span class="curso-count">${curso.lecturas.length} total</span>
                </div>
                <div class="categorias" style="grid-template-columns: repeat(auto-fit, minmax(90px, 1fr))">
                    ${listaCategorias.map(cat => `
                        <div class="categoria-item" data-curso="${curso.curso}" data-tipo="${cat}">
                            <span class="categoria-icono">${ICONOS[cat.toUpperCase()] || '📁'}</span>
                            <span class="categoria-nombre">${cat}</span>
                            <span class="categoria-cantidad">${conteoPorCat[cat]} archivos</span>
                        </div>
                    `).join('')}
                </div>
            `;

            // Hacer que cada cuadrito sea clickeable
            card.querySelectorAll('.categoria-item').forEach(item => {
                item.addEventListener('click', () => {
                    showDetailView(item.dataset.curso, item.dataset.tipo);
                });
            });

            grid.appendChild(card);
        });
        main.appendChild(section);
    });
}
</script>
</body>
</html>
